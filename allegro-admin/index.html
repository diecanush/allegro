<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allegro Fit - Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Allegro Fit</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navBar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navBar">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="#" data-view="dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-view="participantes">Participantes</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-view="profesores">Profesores</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-view="grupos">Grupos</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-view="asistencias">Asistencias</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-view="pagos">Pagos</a></li>
        </ul>
        <span class="navbar-text me-3" id="userInfo"></span>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Salir</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <div id="app"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/participantes.js"></script>
  <script src="js/asistencias.js"></script>
</body>
</html>
